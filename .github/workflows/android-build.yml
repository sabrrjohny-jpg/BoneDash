name: Build BoneDash APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BoneDashAndroidPrototype_CloudBuild.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o BoneDashAndroidPrototype_CloudBuild.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoneDash-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
